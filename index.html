<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NavigatOER · Laligator findet OER-Materialien</title>

  <!-- SEO -->
  <meta name="description" content="NavigatOER hilft Lehrenden und Lernenden, passende Open Educational Resources (OER) zu finden – mit KI-gestützter Suche und Persona-Profilen." />
  <meta name="keywords" content="OER, Open Educational Resources, Bildung, Lernmaterialien, KI, Navigator, LiaScript" />
  <meta name="author" content="jh-488" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://jh-488.github.io/oer-navigator/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jh-488.github.io/oer-navigator/" />
  <meta property="og:title" content="NavigatOER · Laligator findet OER-Materialien" />
  <meta property="og:description" content="KI-gestützte Suche nach Open Educational Resources für Lehrende und Lernende." />
  <meta property="og:image" content="https://jh-488.github.io/oer-navigator/laligator.svg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="NavigatOER · Laligator findet OER-Materialien" />
  <meta name="twitter:description" content="KI-gestützte Suche nach Open Educational Resources für Lehrende und Lernende." />
  <meta name="twitter:image" content="https://jh-488.github.io/oer-navigator/laligator.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="laligator.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-plate"></div>
        <img class="brand-mascot" src="laligator.svg" alt="Laligator" />
      </div>
      <div class="brand-text">
        <h1>Navigat<span class="oer">OER</span></h1>
        <p class="tagline">Der NavigatOER findet passende OER-Materialien für dich.</p>
      </div>
    </div>
  </header>

  <main>
    <section id="search-section">
      <form id="search-form" action="javascript:void(0)">
        <label class="field-label" for="query-input">Wonach suchst du?</label>
        <textarea id="query-input" rows="3" placeholder="Beschreib dein Anliegen in eigenen Worten – z. B. „Aufgaben zur quadratischen Funktion für die 9. Klasse“."></textarea>
        <div class="form-actions">
          <button type="submit" id="search-btn">
            <span class="btn-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11 L14 14"/></svg>
            </span>
            Suchen
          </button>
        </div>
      </form>
    </section>

    <section id="clarification-section" class="hidden">
      <div id="clarification-box">
        <div class="clarify-head">
          <div class="clarify-icon" aria-hidden="true">?</div>
          <p id="clarification-question"></p>
        </div>
        <div id="clarification-options"></div>
        <input type="text" id="clarification-free" placeholder="Oder eigene Antwort eingeben …" />
        <button id="clarification-submit">Weiter</button>
      </div>
    </section>

    <section id="profile-section" class="hidden">
      <div id="search-profile">
        <div id="persona-avatar" class="persona-unknown" title="Persona">
          <span class="persona-fallback">?</span>
        </div>
        <div class="profile-text">
          <span class="profile-label">Suchprofil</span>
          <span id="profile-tags"></span>
        </div>
        <span id="provider-badge" class="provider-badge hidden"></span>
      </div>
    </section>

    <section id="results-section" class="hidden">
      <div id="tab-bar">
        <button id="tab-materials" class="tab-btn active" type="button">Materialien <span id="materials-count" class="tab-count"></span></button>
        <button id="tab-events" class="tab-btn" type="button">Veranstaltungen <span id="events-count" class="tab-count"></span></button>
      </div>
      <div id="tab-materials-panel">
        <span id="view-label" class="view-label"></span>
        <div id="results-container"></div>
      </div>
      <div id="tab-events-panel" class="hidden">
        <div id="events-container"></div>
      </div>
    </section>

    <div id="loading" class="hidden">
      <div class="loading-mascot">
        <img src="laligator.svg" alt="" class="loading-spinner" />
      </div>
      <span>Der NavigatOER stöbert …</span>
    </div>

    <div id="error-banner" class="hidden"></div>
  </main>

  <footer>
    <span>NavigatOER · Open Educational Resources – passend für dich empfohlen.</span>
  </footer>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
